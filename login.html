<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लगइन | Smart Maydevi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    body {
      background: linear-gradient(135deg, #07192f 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      padding: 28px 24px;
      text-align: center;
    }
    .logo-img { height: 65px; margin-bottom: 8px; }
    h2 { font-size: 22px; color: #1e3a8a; font-weight: 800; }
    p.sub { font-size: 13px; color: #64748b; margin-bottom: 20px; font-weight: 600; }
    .form-group { text-align: left; margin-bottom: 14px; position: relative; }
    label { display: block; font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #2563eb; }
    .pwd-wrapper { position: relative; }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 16px;
      user-select: none;
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      background: #1e3a8a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #2563eb; }
    .btn-bypass {
      width: 100%;
      padding: 8px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="https://mayadevimunrupandehi.gov.np/sites/all/themes/newmun/new_logo.png" alt="Logo" class="logo-img" onerror="this.src='assets/nishan%20chap.jpg';">
    <h2>Smart Maydevi</h2>
    <p class="sub">घर नक्सा दर्ता प्रणाली | Staff Login</p>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>प्रयोगकर्ताको नाम (Username)</label>
        <input type="text" id="username" placeholder="उदा: superadmin" required>
      </div>

      <div class="form-group">
        <label>गोप्य पासवर्ड (Password)</label>
        <div class="pwd-wrapper">
          <input type="password" id="password" placeholder="पासवर्ड टाइप गर्नुहोस्" required>
          <span class="toggle-pwd" onclick="togglePasswordVisibility()">👁️</span>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">🔒 लगइन गर्नुहोस्</button>
      <button type="button" class="btn-bypass" onclick="quickSuperadminLogin()">⚡ Quick Login (Superadmin)</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = "https://xyzcompany.supabase.co"; // Tamara Supabase Project nu URL ahiya paste karo
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // Tamaro anon key ahiya paste karo

    let supabaseClient = null;
    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes("xyzcompany")) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    // Master backup accounts (Internet/offline banne ma chalva mate)
    const masterAccounts = [
      { username: 'superadmin', password: 'Admin@123', role: 'superadmin', full_name: 'Super Administrator' },
      { username: 'admin', password: 'Admin@123', role: 'admin', full_name: 'System Admin' },
      { username: 'amin', password: 'Amin@123', role: 'amin', full_name: 'Land Surveyor (Amin)' }
    ];

    function togglePasswordVisibility() {
      const p = document.getElementById("password");
      p.type = (p.type === "password") ? "text" : "password";
    }

    function quickSuperadminLogin() {
      const user = masterAccounts[0];
      sessionStorage.setItem("user", JSON.stringify(user));
      localStorage.setItem("user", JSON.stringify(user));
      window.location.href = "darta.html";
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim().toLowerCase();
      const p = document.getElementById("password").value.trim();
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.textContent = "⏳ लगइन हुँदैछ...";

      let matchedUser = null;

      // 1. Supabase Cloud Database check karo
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('admin_accounts')
            .select('*')
            .eq('username', u)
            .eq('password', p)
            .single();

          if (!error && data) {
            matchedUser = data;
          }
        } catch(err) {
          console.warn("Supabase auth check error:", err);
        }
      }

      // 2. Master accounts fallback
      if (!matchedUser) {
        matchedUser = masterAccounts.find(acc => acc.username.toLowerCase() === u && acc.password === p);
      }

      if (matchedUser) {
        sessionStorage.setItem("user", JSON.stringify(matchedUser));
        localStorage.setItem("user", JSON.stringify(matchedUser));
        alert(`स्वागत छ, ${matchedUser.full_name || matchedUser.username}!`);
        window.location.href = "darta.html";
      } else {
        alert("गलत युजरनेम वा पासवर्ड! कृपया सही विवरण राख्नुहोस्।");
        btn.disabled = false;
        btn.textContent = "🔒 लगइन गर्नुहोस्";
      }
    }
  </script>
</body>
</html>
