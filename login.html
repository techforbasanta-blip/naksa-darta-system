<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कर्मचारी लगइन | Smart Mayadevi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --gov-crimson: #b71c1c;
      --gov-blue: #07192f;
      --gov-navy: #1e3a8a;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --input-bg: #ffffff;
      --text-dark: #0f172a;
      --border-color: #cbd5e1;
      --screen-font: 'Mukta', sans-serif;
    }

    body.dark-mode {
      --bg: #07192f;
      --card-bg: #0d233e;
      --input-bg: #07192f;
      --text-dark: #ffffff;
      --border-color: #1e3a8a;
    }

    * { box-sizing: border-box !important; margin: 0; padding: 0; font-family: var(--screen-font); }
    body { background: var(--bg); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.25s, color 0.25s; }

    .gov-header {
      background: linear-gradient(135deg, #07192f 0%, #1e3a8a 100%);
      border-bottom: 3px solid var(--gov-crimson);
      padding: 8px 18px;
      color: #ffffff;
    }
    .header-inner {
      max-width: 1720px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-left { display: flex; align-items: center; gap: 12px; }
    .brand-left img { height: 52px !important; width: auto !important; }
    .brand-text h1 { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.2; letter-spacing: 0.5px; }
    .brand-text p { font-size: 12px; color: #cbd5e1; font-weight: 500; }

    .header-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .header-clock-box {
      text-align: right;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      line-height: 1.2;
    }
    .header-clock-box .h-date { font-size: 11px; color: #cbd5e1; font-weight: 600; }
    .header-clock-box .h-time { font-size: 12.5px; color: #ffffff; font-weight: 800; }

    .nav-btn {
      background: #0d233e;
      color: #ffffff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: 4px;
      border: 1px solid #1e3a8a;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }
    .btn-theme { background: #1e3a8a !important; border-color: #3b82f6 !important; font-size: 13.5px !important; padding: 5px 9px !important; }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
    }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 440px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 30px 24px;
      text-align: center;
    }
    .login-logo { height: 60px; margin-bottom: 8px; }
    .login-title { font-size: 21px; font-weight: 800; color: #1e3a8a; }
    body.dark-mode .login-title { color: #60a5fa; }
    .login-sub { font-size: 13px; color: #64748b; margin-bottom: 22px; font-weight: 600; }

    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 4px; }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-dark);
    }
    .form-group input:focus { border-color: #2563eb; }

    .pwd-wrapper { position: relative; }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 17px;
      user-select: none;
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: #1e3a8a;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #2563eb; }

    .btn-secret {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11.5px;
      cursor: pointer;
      margin-top: 14px;
      text-decoration: underline;
    }
    .btn-secret:hover { color: #1e3a8a; }

    footer.site-footer {
      background: #07192f; color: #cbd5e1; padding: 8px 18px; font-size: 11.5px;
      border-top: 3px solid #2563eb; margin-top: auto;
    }
    .footer-inner {
      max-width: 1720px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px;
    }
  </style>
</head>
<body>

  <header class="gov-header no-print">
    <div class="header-inner">
      <div class="brand-left">
        <img src="https://mayadevimunrupandehi.gov.np/sites/all/themes/newmun/new_logo.png" alt="Gov Logo" onerror="this.src='assets/nishan%20chap.jpg';">
        <div class="brand-text">
          <h1>Smart Mayadevi</h1>
          <p>"Identity of Mayadevi: Balanced Development, Quality Service and Governance"</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="header-clock-box">
          <div class="h-date" id="liveNepaliHeaderDate">मिति: लोड हुँदैछ...</div>
          <div class="h-time" id="liveNepaliHeaderTime">समय: --:--:--</div>
        </div>
        <button type="button" class="nav-btn btn-theme" id="themeToggleBtn" onclick="toggleTheme()">☾</button>
      </div>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <img src="https://mayadevimunrupandehi.gov.np/sites/all/themes/newmun/new_logo.png" alt="Logo" class="login-logo" onerror="this.src='assets/nishan%20chap.jpg';">
      <div class="login-title">कर्मचारी लगइन पोर्टल</div>
      <div class="login-sub">गाउँ कार्यपालिकाको कार्यालय, बरेवा, रुपन्देही</div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>प्रयोगकर्ता नाम (Username)</label>
          <input type="text" id="username" placeholder="युजरनेम लेख्नुहोस्" required autofocus>
        </div>

        <div class="form-group">
          <label>गोप्य पासवर्ड (Password)</label>
          <div class="pwd-wrapper">
            <input type="password" id="password" placeholder="पासवर्ड लेख्नुहोस्" required>
            <span class="toggle-pwd" id="eyeIcon" onclick="togglePasswordVisibility()">👁️</span>
          </div>
        </div>

        <button type="submit" id="loginBtn" class="btn-login">🔒 लगइन गर्नुहोस्</button>
      </form>

      <!-- Fakt tamare potana secret bypass mate: Koi ne username/password screen par dekhase nahi -->
      <button type="button" class="btn-secret" onclick="secretSuperadminPrompt()">🔒 Admin Direct Recovery Login</button>
    </div>
  </main>

  <footer class="site-footer no-print">
    <div class="footer-inner">
      <div><strong>Smart Mayadevi</strong> — नक्सा दर्ता प्रणाली | बरेवा, रुपन्देही</div>
      <div>Developed by <strong style="color: #38bdf8;">Tech for Basanta</strong></div>
    </div>
  </footer>

  <script>
    const SUPABASE_URL = "https://xyzcompany.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...";

    let supabaseClient = null;
    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes("xyzcompany")) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    const nepDigits = ['०', '१', '२', '३', '४', '५', '६', '७', '८', '९'];
    function toNepNum(n) { return (n ?? '').toString().replace(/\d/g, d => nepDigits[d]); }

    const masterAccounts = [
      { id: 1, full_name: 'Super Administrator', username: 'superadmin', password: 'Admin@123', role: 'superadmin' }
    ];

    function togglePasswordVisibility() {
      const p = document.getElementById("password");
      const eye = document.getElementById("eyeIcon");
      if (p.type === "password") {
        p.type = "text";
        eye.textContent = "🙈";
      } else {
        p.type = "password";
        eye.textContent = "👁️";
      }
    }

    // Secret prompt - koi bija direct bypass nahi kari shake
    function secretSuperadminPrompt() {
      const secretKey = prompt("कृपया गुप्त मास्टर पिन (Master PIN) राख्नुहोस्:");
      if (secretKey === "98765" || secretKey === "Admin@123") {
        const user = masterAccounts[0];
        sessionStorage.setItem("user", JSON.stringify(user));
        localStorage.setItem("user", JSON.stringify(user));
        alert("मास्टर लगइन प्रमाणित भयो!");
        window.location.href = "darta.html";
      } else if (secretKey !== null) {
        alert("गलत पिन!");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("username").value.trim().toLowerCase();
      const p = document.getElementById("password").value.trim();
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.textContent = "⏳ लगइन जाँच हुँदैछ...";

      let matchedUser = null;

      // 1. Supabase Cloud Database check
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('admin_accounts')
            .select('*')
            .eq('username', u)
            .eq('password', p)
            .single();

          if (!error && data) {
            matchedUser = data;
          }
        } catch(err) {
          console.warn("Supabase check error:", err);
        }
      }

      // 2. Local memory fallback
      if (!matchedUser) {
        try {
          const localList = JSON.parse(localStorage.getItem("local_admin_accounts") || "[]");
          matchedUser = localList.find(acc => acc.username.toLowerCase() === u && acc.password === p);
        } catch(e) {}
      }

      // 3. Fallback master superadmin
      if (!matchedUser && u === 'superadmin' && p === 'Admin@123') {
        matchedUser = masterAccounts[0];
      }

      if (matchedUser) {
        sessionStorage.setItem("user", JSON.stringify(matchedUser));
        localStorage.setItem("user", JSON.stringify(matchedUser));
        alert(`स्वागत छ, ${matchedUser.full_name || matchedUser.username}!`);
        window.location.href = "darta.html";
      } else {
        alert("त्रुटि: गलत युजरनेम वा पासवर्ड!");
        btn.disabled = false;
        btn.textContent = "🔒 लगइन गर्नुहोस्";
      }
    }

    function updateClock() {
      const now = new Date();
      const nepDays = ["आइतबार", "सोमबार", "मंगलबार", "बुधबार", "बिहीबार", "शुक्रबार", "शनिबार"];
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");
      let nepPeriod = (h >= 12 && h < 17) ? "दिउँसो" : (h >= 17 && h < 20) ? "साँझ" : (h >= 20 || h < 4) ? "राती" : "विहान";
      document.getElementById("liveNepaliHeaderDate").textContent = `मिति: २०८३ असोज ०८ (${nepDays[now.getDay()]})`;
      document.getElementById("liveNepaliHeaderTime").textContent = `समय: ${nepPeriod} ${toNepNum(String(h % 12 || 12).padStart(2, "0"))}:${toNepNum(m)}:${toNepNum(s)}`;
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      const isDark = document.body.classList.contains("dark-mode");
      localStorage.setItem("mayadevi_naksa_theme", isDark ? "dark" : "light");
      document.getElementById("themeToggleBtn").textContent = isDark ? "☀" : "☾";
    }

    function applySavedTheme() {
      const saved = localStorage.getItem("mayadevi_naksa_theme") || "light";
      if (saved === "dark") {
        document.body.classList.add("dark-mode");
        document.getElementById("themeToggleBtn").textContent = "☀";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();
      setInterval(updateClock, 1000);
      updateClock();
    });
  </script>
</body>
</html>
