<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कर्मचारी लगइन | मायादेवी गाउँपालिका</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; font-family: 'Mukta', sans-serif; margin: 0; padding: 0; }
    body { background-color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }

    .system-header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      border-bottom: 3px solid #b91c1c;
      padding: 12px 24px;
      color: #ffffff;
    }
    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1440px;
      margin: 0 auto;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-left img { height: 55px; }
    .header-brand h1 { font-size: 20px; font-weight: 800; color: #ffffff; }
    .header-brand p { font-size: 13px; color: #cbd5e1; }

    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      text-align: center;
    }
    .login-card h2 { font-size: 20px; font-weight: 800; color: #1e3a8a; margin-bottom: 4px; }
    .login-card p { font-size: 13px; color: #64748b; margin-bottom: 18px; }

    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }

    .btn-submit {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #1d4ed8; }

    .error-alert {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: left;
    }

    footer {
      background: #0f172a;
      color: #cbd5e1;
      padding: 14px 24px;
      font-size: 13px;
      border-top: 3px solid #2563eb;
      margin-top: auto;
    }
    .footer-inner {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header class="system-header">
    <div class="header-inner">
      <div class="header-left">
        <img src="https://mayadevimunrupandehi.gov.np/sites/all/themes/newmun/new_logo.png" 
             alt="नेपाल सरकार" 
             onerror="this.onerror=null; this.src='assets/nishan%20chap.jpg';">
        <div class="header-brand">
          <h1>मायादेवी गाउँपालिका — नक्सा दर्ता प्रणाली</h1>
          <p>गाउँ कार्यपालिकाको कार्यालय, बरेवा, रुपन्देही</p>
        </div>
      </div>
      <div>
        <img src="https://mayadevimunrupandehi.gov.np/sites/mayadevimunrupandehi.gov.np/files/img/mayadevi%20logo.jpg" 
             alt="पालिका लोगो" 
             style="height: 50px; border-radius: 50%;"
             onerror="this.onerror=null; this.src='assets/palika%20logo.jpg';">
      </div>
    </div>
  </header>

  <main class="login-container">
    <div class="login-card">
      <h2>कर्मचारी लगइन</h2>
      <p>Login ID र Password हाल्नुहोस्</p>

      <div id="loginErrorMsg" class="error-alert"></div>

      <form onsubmit="event.preventDefault(); handleUserLogin();" autocomplete="off">
        <div class="form-group">
          <label>प्रयोगकर्ता आइडी (Login ID) *</label>
          <input type="text" id="input_login_id" placeholder="Login ID" required autofocus>
        </div>

        <div class="form-group">
          <label>पासवर्ड (Password) *</label>
          <input type="password" id="input_password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-submit">🔑 लगइन गर्नुहोस्</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div><strong>मायादेवी गाउँपालिका</strong> — नक्सा दर्ता प्रणाली</div>
      <div>📞 For Help / WhatsApp: <strong>९७४३६५३६४४</strong></div>
      <div>Developed by <strong style="color: #38bdf8;">Tech for Basanta</strong></div>
    </div>
  </footer>

  <script>
    function handleUserLogin() {
      const id = document.getElementById("input_login_id").value.trim();
      const pwd = document.getElementById("input_password").value.trim();
      const errBox = document.getElementById("loginErrorMsg");

      errBox.style.display = "none";
      errBox.textContent = "";

      // १. सुपरएडमिन खाता प्रमाणीकरण
      if (id.toLowerCase() === "superadmin" && pwd === "Admin@2083") {
        const superUser = {
          id: 1,
          full_name: "सुपर एडमिन",
          post: "कम्प्युटर अपरेटर",
          login_id: "superadmin",
          role: "superadmin"
        };
        sessionStorage.setItem("user", JSON.stringify(superUser));
        localStorage.setItem("user", JSON.stringify(superUser));
        alert("सुपरएडमिन लगइन सफल भयो!");
        window.location.href = "darta.html";
        return;
      }

      // २. एडमिन प्यानलबाट थपिएका कर्मचारीहरूको प्रमाणीकरण
      try {
        const staffList = JSON.parse(localStorage.getItem("mayadevi_staff_list")) || [];
        const user = staffList.find(u => 
          u.login_id && u.login_id.toString().trim().toLowerCase() === id.toLowerCase() &&
          u.password && u.password.toString().trim() === pwd
        );

        if (user) {
          const sessionUser = {
            id: user.id,
            full_name: user.full_name,
            post: user.post,
            login_id: user.login_id,
            role: (user.login_id.toLowerCase() === "superadmin") ? "superadmin" : "staff"
          };
          sessionStorage.setItem("user", JSON.stringify(sessionUser));
          localStorage.setItem("user", JSON.stringify(sessionUser));
          alert(`स्वागत छ, ${user.full_name}! लगइन सफल भयो।`);
          window.location.href = "darta.html";
          return;
        }
      } catch (e) {
        console.error("लगइन प्रक्रियामा त्रुटि:", e);
      }

      // विवरण नमिलेमा
      errBox.textContent = "प्रयोगकर्ता आइडी वा पासवर्ड मिलेन! कृपया सही विवरण राख्नुहोस्।";
      errBox.style.display = "block";
    }
  </script>
</body>
</html>
