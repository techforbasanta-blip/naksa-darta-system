<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कर्मचारी व्यवस्थापन | मायादेवी गाउँपालिका</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; font-family: 'Mukta', 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; background-color: #f8fafc; color: #1e293b; }
    
    .admin-header {
      background: #ffffff;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
    }
    .admin-header h1 { margin: 0; font-size: 18px; color: #b91c1c; }
    .btn-link {
      padding: 6px 14px;
      text-decoration: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }
    .btn-home { background: #2563eb; }
    .btn-logout { background: #dc2626; border: none; cursor: pointer; }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th { background: #f1f5f9; padding: 10px; text-align: left; font-size: 14px; border: 1px solid #cbd5e1; }
    td { padding: 10px; border: 1px solid #e2e8f0; font-size: 14px; }
    input { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
    .btn-save { background: #16a34a; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1>मायादेवी गाउँपालिका — कर्मचारी तथा पासवर्ड व्यवस्थापन</h1>
    <div style="display: flex; gap: 10px;">
      <a href="darta.html" class="btn-link btn-home">📝 दर्ता फाराम</a>
      <button onclick="sessionStorage.clear(); localStorage.clear(); window.location.href='login.html';" class="btn-link btn-logout">🚪 लगआउट</button>
    </div>
  </header>

  <main class="container">
    <h2 style="margin-top:0;">कर्मचारी विवरण तथा पासवर्ड सूची</h2>
    <table>
      <thead>
        <tr>
          <th>नाम</th>
          <th>Login ID</th>
          <th>पासवर्ड</th>
          <th>कार्य</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" id="name-super" value="सुपर एडमिन"></td>
          <td><input type="text" id="id-super" value="superadmin"></td>
          <td>
            <input type="password" id="pwd-super" value="Admin@2083" style="width: 120px;">
            <button type="button" onclick="const p=document.getElementById('pwd-super'); p.type = (p.type==='password'?'text':'password');" style="cursor:pointer; border:none; background:none;">👁️</button>
          </td>
          <td><button class="btn-save" onclick="alert('सुरक्षित गरियो!')">सुरक्षित</button></td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
