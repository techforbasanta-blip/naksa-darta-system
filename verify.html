<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Mayadevi - प्रमाणिकरण पोर्टल</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', sans-serif; }
    body { background-color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; }

    .gov-header {
      background: linear-gradient(135deg, #07192f 0%, #1e3a8a 100%);
      border-bottom: 3px solid #b71c1c;
      padding: 10px 18px;
      color: #ffffff;
      text-align: center;
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .header-inner img { height: 48px; }
    .header-titles h1 { font-size: 20px; font-weight: 800; color: #ffffff; }
    .header-titles p { font-size: 13px; color: #cbd5e1; }

    .verify-container {
      max-width: 650px; width: 92%; margin: 26px auto; background: #ffffff;
      border: 1px solid #cbd5e1; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 22px;
    }

    .badge-status {
      display: inline-block; background: #16a34a; color: #ffffff; padding: 6px 16px;
      border-radius: 20px; font-size: 14.5px; font-weight: 800; margin-bottom: 12px;
    }

    .details-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 15.5px; }
    .details-table td { padding: 9px 8px; border-bottom: 1px solid #e2e8f0; }
    .details-table td.lbl { font-weight: 800; color: #1e3a8a; width: 42%; }
    .details-table td.val { font-weight: 700; color: #0f172a; width: 58%; }

    .photo-preview-box {
      text-align: center; margin-bottom: 12px;
    }
    .photo-preview-box img {
      width: 90px; height: 105px; object-fit: cover; border: 2px solid #1e3a8a; border-radius: 4px;
    }

    footer {
      background: #07192f; color: #cbd5e1; padding: 12px; text-align: center; font-size: 12px; margin-top: auto;
    }
  </style>
</head>
<body>

  <header class="gov-header">
    <div class="header-inner">
      <img src="https://mayadevimunrupandehi.gov.np/sites/all/themes/newmun/new_logo.png" alt="Logo" onerror="this.src='assets/nishan%20chap.jpg';">
      <div class="header-titles">
        <h1>Smart Mayadevi</h1>
        <p>घर नक्सा आधिकारिक प्रमाणिकरण प्रणाली | Official Verification</p>
      </div>
    </div>
  </header>

  <main class="verify-container">
    <div style="text-align: center;">
      <div id="verifiedBadge" class="badge-status">✔ प्रमाणित प्रमाण-पत्र (Verified Record)</div>
      <div id="photoContainer" class="photo-preview-box" style="display:none;">
        <img id="ownerPhoto" src="" alt="फोटो">
      </div>
    </div>

    <div id="verifyDetailsBox">
      <p style="text-align:center; color:#64748b;">विवरण खोजिँदैछ...</p>
    </div>
  </main>

  <footer>
    Smart Mayadevi — नक्सा दर्ता तथा प्रमाणिकरण | गाउँ कार्यपालिकाको कार्यालय, बरेवा, रुपन्देही
  </footer>

  <script>
    const SUPABASE_URL = "https://xyzcompany.supabase.co"; 
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; 
    
    let supabaseClient = null;
    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes("xyzcompany") && typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {}

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const queryDarta = urlParams.get('darta');
      
      let item = null;

      if (queryDarta && supabaseClient) {
        try {
          const decoded = decodeURIComponent(queryDarta).trim();
          const { data, error } = await supabaseClient
            .from('naksa_records')
            .select('*')
            .ilike('darta_no', decoded)
            .limit(1);

          if (!error && data && data.length > 0) {
            item = data[0];
          }
        } catch(e) {}
      }

      if (!item) {
        try {
          const records = JSON.parse(localStorage.getItem("naksa_records") || "[]");
          if (queryDarta) {
            const dec = decodeURIComponent(queryDarta).trim().toLowerCase();
            item = records.find(r => r.darta_no && r.darta_no.trim().toLowerCase() === dec);
          }
          if (!item) {
            item = JSON.parse(localStorage.getItem("last_verified_record") || "null");
          }
        } catch(e) {}
      }

      const box = document.getElementById("verifyDetailsBox");
      const badge = document.getElementById("verifiedBadge");

      if (item) {
        if (item.photo) {
          document.getElementById("ownerPhoto").src = item.photo;
          document.getElementById("photoContainer").style.display = "block";
        }

        box.innerHTML = `
          <table class="details-table">
            <tr><td class="lbl">१) नक्सा दर्ता नं.</td><td class="val" style="color:#b71c1c; font-size:16.5px;">${item.darta_no}</td></tr>
            <tr><td class="lbl">२) दर्ता मिति</td><td class="val">${item.reg_date || '-'}</td></tr>
            <tr><td class="lbl">३) प्रमाण पत्र नं.</td><td class="val">${item.praman_no || '-'}</td></tr>
            <tr><td class="lbl">४) जग्गा धनीको नामथर</td><td class="val"><strong>${item.owner_name || item.house_owner}</strong></td></tr>
            <tr><td class="lbl">घर धनीको नामथर</td><td class="val">${item.house_owner || '-'}</td></tr>
            <tr><td class="lbl">ठेगाना / वडा</td><td class="val">मायादेवी गाउँपालिका, वडा नं. ${item.ward || '-'}</td></tr>
            <tr><td class="lbl">कित्ता नं.</td><td class="val">${item.kitta || '-'}</td></tr>
            <tr><td class="lbl">कुल निर्माण क्षेत्रफल</td><td class="val">${item.total_area || item.approved_area || '-'} वर्गफिट</td></tr>
            <tr><td class="lbl">निर्णय मिति</td><td class="val">${item.dec_date || '-'}</td></tr>
            <tr><td class="lbl">प्रमाणित गर्ने अधिकृत</td><td class="val">${item.officer || '-'} (${item.officer_role || 'प्रमुख प्रशासकीय अधिकृत'})</td></tr>
          </table>
        `;
      } else {
        badge.style.background = "#dc2626";
        badge.textContent = "✖ रेकर्ड फेला परेन (Record Not Found)";
        box.innerHTML = `<p style="text-align:center; padding: 25px; color:#64748b; font-weight:bold;">यो दर्ता नम्बरको नक्सा प्रमाण-पत्र सिस्टममा भेटिएन।</p>`;
      }
    });
  </script>
</body>
</html>
